<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акбарс — Онлайн-заказы</title>
<style>
:root {
  --accent: #0071e3;
  --bg: #fbfbfd;
  --card: #fff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --border: #d2d2d7;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; font-size: 15px; line-height: 1.4; }
header { padding: 0.75rem 1.25rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(251,251,253,.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 1.25rem; font-weight: 600; cursor: pointer; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 1rem; align-items: center; font-size: 0.9rem; }
nav a, nav button { color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: none; }
nav a:hover, nav button:hover { color: var(--text); }
.btn { background: var(--accent); color: #fff; border: none; padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.hero { padding: 1.5rem 1.25rem 1rem; max-width: 1100px; margin: 0 auto; }
.hero h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.3rem; }
.hero p { color: var(--muted); font-size: 0.95rem; }
.categories { display: flex; gap: 0.4rem; flex-wrap: wrap; padding: 0.5rem 1.25rem 1rem; max-width: 1100px; margin: 0 auto; }
.cat-btn { background: #fff; border: 1px solid var(--border); padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.8rem; cursor: pointer; }
.cat-btn.active, .cat-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.venues { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; padding: 0 1.25rem 2rem; max-width: 1100px; margin: 0 auto; }
.venue-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: box-shadow .15s; }
.venue-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.venue-img { height: 100px; background-size: cover; background-position: center; background-color: #f5f5f7; }
.venue-info { padding: 0.65rem 0.75rem; }
.venue-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.15rem; }
.venue-info p { color: var(--muted); font-size: 0.75rem; line-height: 1.3; }
.badge { display: inline-block; background: #f5f5f7; color: var(--muted); font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 4px; margin-top: 0.25rem; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
.modal.open { display: flex; }
.modal-content { background: #fff; border-radius: 16px; max-width: 480px; width: 100%; margin: 1rem auto; padding: 1rem 1.1rem; max-height: 90vh; overflow-y: auto; }
.close { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); }
.menu-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.55rem 0; border-bottom: 1px solid #f0f0f2; font-size: 0.9rem; }
.menu-item button { background: var(--accent); color: #fff; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
.cart { margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
.order-form input, .order-form select, .order-form textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.45rem; font-size: 0.9rem; background: #fbfbfd; }
footer { text-align: center; padding: 1rem; color: var(--muted); font-size: 0.75rem; border-top: 1px solid var(--border); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<header>
  <div class="logo" onclick="showPage('home')">Ак<span>барс</span></div>
  <nav>
    <a href="#" onclick="showPage('home');return false;">Заведения</a>
    <button class="btn btn-outline" onclick="openAuth('login')">Войти</button>
    <button class="btn" onclick="openAuth('register')">Регистрация</button>
  </nav>
</header>
<div id="page-home">
  <section class="hero">
    <h1>Акбарс</h1>
    <p>Онлайн-заказы для кафе, ресторанов и барбершопов Бишкека</p>
  </section>
  <div class="categories">
    <button class="cat-btn active" data-cat="all">Все</button>
    <button class="cat-btn" data-cat="cafe">Кафе</button>
    <button class="cat-btn" data-cat="restaurant">Рестораны</button>
    <button class="cat-btn" data-cat="barber">Барбершопы</button>
    <button class="cat-btn" data-cat="shop">Магазины</button>
  </div>
  <section class="venues" id="venues"></section>
</div>
<footer>Акбарс · Команда 67</footer>
<div class="modal" id="modal"><div class="modal-content"><button class="close" onclick="closeModal()">&times;</button><div id="modal-body"></div></div></div>
<div class="modal auth-modal" id="authModal"><div class="modal-content"><button class="close" onclick="closeAuth()">&times;</button><h2 id="authTitle">Вход</h2><div class="order-form"><input type="email" placeholder="Email"><input type="password" placeholder="Пароль"><button class="btn" style="width:100%;" onclick="fakeAuth()">Продолжить</button></div></div></div>
<script>
const venues = [
  { id:1, name:"Navat", cat:"restaurant", type:"Чайхана", desc:"Национальная кухня · Тоголок Молдо, 114/1", img:"https://img4.restaurantguru.com/w550/h367/r233-design-Navat-2026-05-2.jpg", map:"https://maps.google.com/?q=Navat+Togolok+Moldo+114+Bishkek", menu:[{name:"Плов",price:320},{name:"Лагман",price:280},{name:"Шашлык",price:420},{name:"Самса",price:70},{name:"Чай",price:40}] },
  { id:2, name:"Arzu", cat:"restaurant", type:"Ресторан", desc:"Кыргызская кухня · пр. Победы, 311", img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&q=80", map:"https://maps.google.com/?q=Arzu+Pobedy+311+Bishkek", menu:[{name:"Бешбармак",price:480},{name:"Плов",price:300},{name:"Оромо",price:220},{name:"Шорпо",price:290}] },
  { id:3, name:"Faiza", cat:"cafe", type:"Чайхана", desc:"Национальная кухня · Жибек Жолу, 555", img:"https://media-cdn.tripadvisor.com/media/photo-m/1280/19/5c/18/80/photo0jpg.jpg", map:"https://maps.google.com/?q=Faiza+Zhibek+Zholu+555+Bishkek", menu:[{name:"Плов",price:280},{name:"Манты",price:45},{name:"Самса",price:65},{name:"Лагман",price:260}] },
  { id:4, name:"Sierra Coffee", cat:"cafe", type:"Кофейня", desc:"Кофе и завтраки · пр. Манаса, 57/1", img:"https://img4.restaurantguru.com/w550/h367/r8a8-SIERRA-Coffee-Manas-Ave-interior.jpg", map:"https://maps.google.com/?q=Sierra+Coffee+Manas+57+Bishkek", menu:[{name:"Капучино",price:180},{name:"Латте",price:190},{name:"Американо",price:150},{name:"Круассан",price:140}] },
  { id:5, name:"Ant's", cat:"cafe", type:"Кофейня", desc:"Кофейня · бул. Эркиндик", img:"https://img4.restaurantguru.ru/w550/h367/r11d-ANTS-design-2026-05-3.jpg", map:"https://maps.google.com/?q=Ants+coffee+Erkindik+Bishkek", menu:[{name:"Капучино",price:200},{name:"Флэт уайт",price:210},{name:"Чизкейк",price:280},{name:"Тост",price:220}] },
  { id:6, name:"Адат", cat:"barber", type:"Барбершоп", desc:"Стрижка от 990 сом · Токтогула, 191", img:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=600&q=80", map:"https://maps.google.com/?q=Adat+barbershop+Toktogula+191+Bishkek", menu:[{name:"Мужская стрижка",price:990},{name:"Борода",price:600},{name:"Комплекс",price:1400}] },
  { id:7, name:"Кыраан", cat:"barber", type:"Барбершоп", desc:"Стрижка от 800 сом · Турусбекова, 82", img:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=600&q=80", map:"https://maps.google.com/?q=Kyraan+barbershop+Turusbekova+82+Bishkek", menu:[{name:"Мужская стрижка",price:800},{name:"Борода",price:500},{name:"Стрижка + борода",price:1200}] },
  { id:8, name:"Brutal", cat:"barber", type:"Барбершоп", desc:"Стрижка от 1200 сом · Токомбаева, 21/3в", img:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=600&q=80", map:"https://maps.google.com/?q=Brutal+barbershop+Tokombaeva+21+Bishkek", menu:[{name:"Мужская стрижка",price:1200},{name:"Оформление бороды",price:700},{name:"Комплекс",price:1700}] },
  { id:9, name:"Green Market", cat:"shop", type:"Магазин", desc:"Продукты · Бишкек", img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=600&q=80", map:"https://maps.google.com/?q=supermarket+Bishkek", menu:[{name:"Молоко 1 л",price:90},{name:"Хлеб",price:35},{name:"Яйца 10 шт",price:130},{name:"Сыр",price:200}] },
  { id:10, name:"Фрунзе", cat:"restaurant", type:"Ресторан", desc:"Авторская кухня · Абдумомунова, 220а", img:"https://media-cdn.tripadvisor.com/media/photo-m/1280/0c/a6/8a/72/restaurant-frunze.jpg", map:"https://maps.google.com/?q=Frunze+restaurant+Abdumomunova+220+Bishkek", menu:[{name:"Стейк",price:1200},{name:"Салат",price:450},{name:"Суп дня",price:380}] }
];
let cart = []; let currentVenue = null; let currentTable = null;
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('venue')) { const vid = parseInt(urlParams.get('venue')); currentTable = urlParams.get('table') || '1'; setTimeout(() => openVenue(vid), 100); }
function renderVenues(filter = "all") {
  const el = document.getElementById("venues");
  el.innerHTML = venues.filter(v => filter === "all" || v.cat === filter).map(v => `
    <div class="venue-card" onclick="openVenue(${v.id})">
      <div class="venue-img" style="background-image:url('${v.img}')"></div>
      <div class="venue-info">
        <h3>${v.name}</h3>
        <p>${v.desc}</p>
        <span class="badge">${v.cat === "barber" ? "Запись" : "QR-заказ"}</span>
      </div>
    </div>`).join("");
}
function openVenue(id) { currentVenue = venues.find(v => v.id === id); if (!currentVenue) return; cart = []; showModal(); }
function showModal() {
  const body = document.getElementById("modal-body");
  const isBarber = currentVenue.cat === "barber";
  const isFood = currentVenue.cat === "restaurant" || currentVenue.cat === "cafe";
  let extra = '';
  if (isFood) extra = `<div style="margin:0.6rem 0;"><label style="font-size:0.8rem;color:var(--muted);">Гостей</label><select id="guests" style="width:100%;padding:0.4rem;border:1px solid var(--border);border-radius:6px;margin-top:0.2rem;"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select><label style="font-size:0.8rem;color:var(--muted);display:block;margin-top:0.4rem;">Тип</label><select id="orderType" style="width:100%;padding:0.4rem;border:1px solid var(--border);border-radius:6px;margin-top:0.2rem;"><option>В зале</option><option>Самовывоз</option><option>Доставка</option></select></div>`;
  else if (isBarber) extra = `<div style="margin:0.6rem 0;"><label style="font-size:0.8rem;color:var(--muted);">Время</label><select id="timeSlot" style="width:100%;padding:0.4rem;border:1px solid var(--border);border-radius:6px;margin-top:0.2rem;"><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option><option>18:00</option></select></div>`;
  body.innerHTML = `<h2 style="font-size:1.15rem;margin-bottom:0.3rem;">${currentVenue.name}</h2><p style="color:var(--muted);font-size:0.8rem;margin-bottom:0.6rem;">${currentVenue.desc}</p>${extra}<div>${currentVenue.menu.map((item,i)=>`<div class="menu-item"><div><div>${item.name}</div><div style="color:var(--muted);font-size:0.75rem;">${item.price} сом</div>${isFood?`<div style="font-size:0.7rem;margin-top:0.15rem;"><label><input type="checkbox" style="margin-right:0.2rem;">без лука</label> <label style="margin-left:0.4rem;"><input type="checkbox" style="margin-right:0.2rem;">доп. соус</label></div>`:''}${isBarber&&item.name.toLowerCase().includes('стриж')?`<div style="font-size:0.7rem;margin-top:0.15rem;"><label><input type="checkbox" style="margin-right:0.2rem;">+ борода</label></div>`:''}</div><div style="display:flex;align-items:center;gap:0.25rem;"><button onclick="changeQty(${i},-1)">−</button><span id="qty-${i}">0</span><button onclick="changeQty(${i},1)">+</button></div></div>`).join('')}</div><div class="cart" id="cart-section"></div>`;
  document.getElementById("modal").classList.add("open"); updateCart();
}
function changeQty(index, delta) {
  const item = currentVenue.menu[index];
  let existing = cart.find(c => c.name === item.name);
  if (delta > 0) { if (!existing) cart.push({...item, qty:1}); else existing.qty++; }
  else if (existing) { existing.qty--; if (existing.qty <= 0) cart = cart.filter(c => c.name !== item.name); }
  const q = cart.find(c => c.name === item.name);
  document.getElementById(`qty-${index}`).textContent = q ? q.qty : 0; updateCart();
}
function updateCart() {
  const section = document.getElementById("cart-section");
  if (!section) return;
  if (cart.length === 0) { section.innerHTML = "<p style='color:var(--muted);font-size:0.85rem;'>Корзина пуста</p>"; return; }
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  section.innerHTML = `<h3 style="font-size:0.95rem;margin-bottom:0.4rem;">Заказ</h3>${cart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:0.2rem;"><span>${i.name} × ${i.qty}</span><span>${i.price*i.qty} сом</span></div>`).join('')}<div style="font-weight:600;margin:0.4rem 0;">Итого: ${total} сом</div><div class="order-form"><input id="clientName" placeholder="Имя"><input id="clientPhone" placeholder="Телефон"><textarea id="clientComment" placeholder="Комментарий" rows="2"></textarea><button class="btn" style="width:100%;" onclick="placeOrder()">Оформить</button></div>`;
}
function placeOrder() {
  const name = document.getElementById("clientName").value.trim();
  const phone = document.getElementById("clientPhone").value.trim();
  if (!name || !phone) { alert("Укажите имя и телефон"); return; }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById("modal-body").innerHTML = `<div style="text-align:center;padding:1rem 0;"><h3 style="color:var(--accent);">Принято</h3><p>${currentVenue.name}</p><p>Сумма: ${total} сом</p><button class="btn" style="margin-top:0.8rem;" onclick="closeModal()">Закрыть</button></div>`;
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function openAuth(t) { document.getElementById("authTitle").textContent = t==="login"?"Вход":"Регистрация"; document.getElementById("authModal").classList.add("open"); }
function closeAuth() { document.getElementById("authModal").classList.remove("open"); }
function fakeAuth() { alert("После подключения базы"); closeAuth(); }
function showPage(p) { document.getElementById("page-home").style.display = p==="home"?"block":"none"; }
document.querySelectorAll(".cat-btn").forEach(btn => { btn.addEventListener("click", () => { document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); renderVenues(btn.dataset.cat); }); });
document.getElementById("modal").addEventListener("click", e => { if (e.target.id==="modal") closeModal(); });
document.getElementById("authModal").addEventListener("click", e => { if (e.target.id==="authModal") closeAuth(); });
renderVenues();
</script>
</body>
</html>
