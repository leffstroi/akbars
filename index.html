<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акбарс — Онлайн-заказы</title>
<style>
:root {
  --gold: #D4AF37;
  --olive: #BDB76B;
  --cream: #FDFBD4;
  --orange: #CE8946;
  --bg: #FFFEF8;
  --card: #FFFFFF;
  --text: #2C2A24;
  --muted: #7A7568;
  --border: #E8E4D4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
header {
  padding: 1rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: rgba(255,254,248,.95);
  backdrop-filter: blur(10px);
  z-index: 100;
}
.logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; cursor: pointer; }
.logo span { color: var(--orange); }
nav { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
nav a, nav button.linkish {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.92rem;
  background: none;
  border: none;
  cursor: pointer;
  transition: color .2s;
}
nav a:hover, nav button.linkish:hover { color: var(--text); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--gold);
  color: #2C2A24;
  border: none;
  padding: 0.55rem 1.1rem;
  border-radius: 9px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(212,175,55,.3); }
.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--cream); box-shadow: none; }
.btn-sm { padding: 0.4rem 0.85rem; font-size: 0.82rem; }
.hero {
  padding: 2.8rem 1.5rem 1.6rem;
  text-align: center;
  max-width: 820px;
  margin: 0 auto;
}
.hero h1 {
  font-size: clamp(1.9rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: 0.7rem;
}
.hero p { color: var(--muted); font-size: 1.02rem; max-width: 460px; margin: 0 auto 1.3rem; }
.categories {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 1.5rem 1.1rem;
}
.cat-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.38rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.84rem;
  transition: all .2s;
}
.cat-btn.active, .cat-btn:hover {
  background: var(--gold);
  border-color: var(--gold);
}
.venues {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1rem;
  padding: 0 1.5rem 2.5rem;
  max-width: 1060px;
  margin: 0 auto;
}
.venue-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.venue-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 22px rgba(44,42,36,.07);
}
.venue-img {
  height: 140px;
  background-size: cover;
  background-position: center;
  background-color: var(--cream);
}
.venue-info { padding: 0.85rem; }
.venue-info h3 { font-size: 1rem; margin-bottom: 0.1rem; }
.venue-info p { color: var(--muted); font-size: 0.78rem; }
.badge {
  display: inline-block;
  background: rgba(212,175,55,.18);
  color: #8A6F1A;
  font-size: 0.68rem;
  padding: 0.1rem 0.38rem;
  border-radius: 4px;
  margin-top: 0.3rem;
}
.map-link {
  display: inline-block;
  margin-top: 0.45rem;
  font-size: 0.78rem;
  color: var(--orange);
  text-decoration: none;
}
.map-link:hover { text-decoration: underline; }
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44,42,36,.4);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: 16px;
  max-width: 500px;
  width: 100%;
  max-height: 86vh;
  overflow-y: auto;
  padding: 1.3rem;
  border: 1px solid var(--border);
}
.close {
  float: right;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.3rem;
  cursor: pointer;
}
.menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
}
.menu-item button {
  background: var(--gold);
  color: #2C2A24;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
}
.cart { margin-top: 1rem; padding-top: 0.7rem; border-top: 1px solid var(--border); }
.order-form input, .order-form textarea {
  width: 100%;
  background: #FFFEF8;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.65rem;
  border-radius: 8px;
  margin-bottom: 0.55rem;
  font-size: 0.92rem;
}
footer {
  text-align: center;
  padding: 1.2rem;
  color: var(--muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
}
.auth-modal .modal-content { max-width: 380px; text-align: center; }
.auth-modal h2 { margin-bottom: 0.6rem; }
.create-section, .guide-section {
  max-width: 680px;
  margin: 0 auto;
  padding: 1.5rem;
}
.create-section h2, .guide-section h2 { margin-bottom: 0.8rem; }
.create-section input, .create-section select, .create-section textarea {
  width: 100%;
  background: #FFFEF8;
  border: 1px solid var(--border);
  padding: 0.65rem;
  border-radius: 8px;
  margin-bottom: 0.6rem;
  font-size: 0.92rem;
}
.menu-builder-item {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}
.menu-builder-item input { flex: 1; margin-bottom: 0; }
.guide-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.1rem;
  margin-bottom: 1rem;
}
.guide-block h3 { margin-bottom: 0.5rem; color: var(--orange); }
.guide-block p { margin-bottom: 0.4rem; font-size: 0.92rem; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<header>
  <div class="logo" onclick="showPage('home')">Ак<span>барс</span></div>
  <nav>
    <a href="#" onclick="showPage('home'); return false;">Заведения</a>
    <button class="btn btn-outline btn-sm" onclick="openAuth('login')">Войти</button>
    <button class="btn btn-sm" onclick="openAuth('register')">Регистрация</button>
  </nav>
</header>

<div id="page-home">
  <section class="hero">
    <h1>Акбарс</h1>
    <p>Заведения Бишкека</p>
    <button class="btn" onclick="document.getElementById('venues').scrollIntoView({behavior:'smooth'})">Смотреть</button>
  </section>

  <div class="categories">
    <button class="cat-btn active" data-cat="all">Все</button>
    <button class="cat-btn" data-cat="cafe">Кафе</button>
    <button class="cat-btn" data-cat="restaurant">Рестораны</button>
    <button class="cat-btn" data-cat="barber">Барбершопы</button>
    <button class="cat-btn" data-cat="shop">Магазины</button>
  </div>

  <section class="venues" id="venues"></section>
</div>

<div id="page-guide" style="display:none;">
  <div class="guide-section">
    <button class="btn" onclick="showPage('home')">Назад</button>
  </div>
</div>

<div id="page-create" style="display:none;">
  <div class="create-section">
    <h2>Добавить заведение</h2>
    <input type="text" id="bizName" placeholder="Название заведения">
    <select id="bizCat">
      <option value="cafe">Кафе</option>
      <option value="restaurant">Ресторан</option>
      <option value="barber">Барбершоп</option>
      <option value="shop">Магазин</option>
    </select>
    <input type="text" id="bizDesc" placeholder="Адрес">
    <h3 style="margin:1rem 0 0.5rem;font-size:1rem;">Меню</h3>
    <div id="menuBuilder"></div>
    <button class="btn btn-outline" style="margin-bottom:1rem;" onclick="addMenuRow()">+ Добавить позицию</button>
    <h3 style="margin:1.2rem 0 0.5rem;font-size:1rem;">Telegram</h3>
    <a href="https://t.me/AkBarsOrdersBot?start=connect" target="_blank" class="btn btn-outline" style="margin-bottom:0.6rem;display:inline-block;">Подключить</a>
    <input type="text" id="telegramId" placeholder="Chat ID">
    <div id="telegramStatus" style="font-size:0.85rem;color:var(--orange);margin-bottom:1rem;"></div>
    <button class="btn" style="width:100%;" onclick="saveVenue()">Сохранить</button>
  </div>
</div>

<footer>Акбарс · Команда 67 · SkillLab AI Hackathon 2026</footer>

<div class="modal auth-modal" id="authModal">
  <div class="modal-content">
    <button class="close" onclick="closeAuth()">&times;</button>
    <h2 id="authTitle">Вход</h2>
    <div class="order-form">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Пароль">
      <button class="btn" style="width:100%;margin-top:0.4rem;" onclick="fakeAuth()">Продолжить</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const venues = [
  { id:1, name:"Navat", cat:"restaurant", type:"Чайхана", desc:"Национальная кухня · Тоголок Молдо, 114/1", img:"https://img4.restaurantguru.com/w550/h367/r233-design-Navat-2026-05-2.jpg", map:"https://maps.google.com/?q=Navat+Togolok+Moldo+114+Bishkek", menu:[{name:"Плов",price:320},{name:"Лагман",price:280},{name:"Шашлык",price:420},{name:"Самса",price:70},{name:"Чай",price:40}] },
  { id:2, name:"Arzu", cat:"restaurant", type:"Ресторан", desc:"Кыргызская кухня · пр. Победы, 311", img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&q=80", map:"https://maps.google.com/?q=Arzu+Pobedy+311+Bishkek", menu:[{name:"Бешбармак",price:480},{name:"Плов",price:300},{name:"Оромо",price:220},{name:"Шорпо",price:290}] },
  { id:3, name:"Faiza", cat:"cafe", type:"Чайхана", desc:"Национальная кухня · Жибек Жолу, 555", img:"https://media-cdn.tripadvisor.com/media/photo-m/1280/19/5c/18/80/photo0jpg.jpg", map:"https://maps.google.com/?q=Faiza+Zhibek+Zholu+555+Bishkek", menu:[{name:"Плов",price:280},{name:"Манты",price:45},{name:"Самса",price:65},{name:"Лагман",price:260}] },
  { id:4, name:"Sierra Coffee", cat:"cafe", type:"Кофейня", desc:"Кофе и завтраки · пр. Манаса, 57/1", img:"https://img4.restaurantguru.com/w550/h367/r8a8-SIERRA-Coffee-Manas-Ave-interior.jpg", map:"https://maps.google.com/?q=Sierra+Coffee+Manas+57+Bishkek", menu:[{name:"Капучино",price:180},{name:"Латте",price:190},{name:"Американо",price:150},{name:"Круассан",price:140}] },
  { id:5, name:"Ant's", cat:"cafe", type:"Кофейня", desc:"Кофейня · бул. Эркиндик", img:"https://img4.restaurantguru.ru/w550/h367/r11d-ANTS-design-2026-05-3.jpg", map:"https://maps.google.com/?q=Ants+coffee+Erkindik+Bishkek", menu:[{name:"Капучино",price:200},{name:"Флэт уайт",price:210},{name:"Чизкейк",price:280},{name:"Тост",price:220}] },
  { id:6, name:"Адат", cat:"barber", type:"Барбершоп", desc:"Стрижка от 990 сом · Токтогула, 191", img:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=600&q=80", map:"https://maps.google.com/?q=Adat+barbershop+Toktogula+191+Bishkek", menu:[{name:"Мужская стрижка",price:990},{name:"Борода",price:600},{name:"Комплекс",price:1400}] },
  { id:7, name:"Кыраан", cat:"barber", type:"Барбершоп", desc:"Стрижка от 800 сом · Турусбекова, 82", img:"https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=600&q=80", map:"https://maps.google.com/?q=Kyraan+barbershop+Turusbekova+82+Bishkek", menu:[{name:"Мужская стрижка",price:800},{name:"Борода",price:500},{name:"Стрижка + борода",price:1200}] },
  { id:8, name:"Brutal", cat:"barber", type:"Барбершоп", desc:"Стрижка от 1200 сом · Токомбаева, 21/3в", img:"https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=600&q=80", map:"https://maps.google.com/?q=Brutal+barbershop+Tokombaeva+21+Bishkek", menu:[{name:"Мужская стрижка",price:1200},{name:"Оформление бороды",price:700},{name:"Комплекс",price:1700}] },
  { id:9, name:"Green Market", cat:"shop", type:"Магазин", desc:"Продукты · Бишкек", img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=600&q=80", map:"https://maps.google.com/?q=supermarket+Bishkek", menu:[{name:"Молоко 1 л",price:90},{name:"Хлеб",price:35},{name:"Яйца 10 шт",price:130},{name:"Сыр",price:200}] },
  { id:10, name:"Фрунзе", cat:"restaurant", type:"Ресторан", desc:"Авторская кухня · Абдумомунова, 220а", img:"https://media-cdn.tripadvisor.com/media/photo-m/1280/0c/a6/8a/72/restaurant-frunze.jpg", map:"https://maps.google.com/?q=Frunze+restaurant+Abdumomunova+220+Bishkek", menu:[{name:"Стейк",price:1200},{name:"Салат",price:450},{name:"Суп дня",price:380}] }
];

let cart = [];
let currentVenue = null;
let currentTable = null;

// Check URL params for table QR mode
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('venue')) {
  const vid = parseInt(urlParams.get('venue'));
  currentTable = urlParams.get('table') || '1';
  setTimeout(() => openVenue(vid), 100);
}

function renderVenues(filter = "all") {
  const el = document.getElementById("venues");
  el.innerHTML = venues
    .filter(v => filter === "all" || v.cat === filter)
    .map(v => `
      <div class="venue-card" onclick="openVenue(${v.id})">
        <div class="venue-img" style="background-image:url('${v.img}')"></div>
        <div class="venue-info">
          <h3>${v.name}</h3>
          <p>${v.desc}</p>
          <span class="badge">${v.cat === "barber" ? "Запись" : "QR-заказ"}</span>
          <br>
          <a class="map-link" href="${v.map}" target="_blank" onclick="event.stopPropagation()">Открыть на карте</a>
        </div>
      </div>
    `).join("");
}

function openVenue(id) {
  currentVenue = venues.find(v => v.id === id);
  if (!currentVenue) return;
  cart = [];
  showModal();
}

function showModal() {
  const body = document.getElementById("modal-body");
  const tableNote = currentTable ? `<div style="background:var(--cream);padding:0.5rem;border-radius:8px;margin-bottom:0.7rem;font-size:0.9rem;">Стол ${currentTable} · <button class="btn btn-sm" onclick="callWaiter()" style="margin-left:0.5rem;">Позвать официанта</button></div>` : '';
  body.innerHTML = `
    <h2>${currentVenue.name}</h2>
    <p style="color:var(--muted);margin-bottom:0.7rem;font-size:0.9rem;">${currentVenue.desc}</p>
    ${tableNote}
    <div>
      ${currentVenue.menu.map((item, i) => `
        <div class="menu-item">
          <div>
            <div>${item.name}</div>
            <div style="color:var(--muted);font-size:0.8rem;">${item.price} сом</div>
          </div>
          <div style="display:flex;align-items:center;gap:0.3rem;">
            <button onclick="changeQty(${i}, -1)" style="width:24px;height:24px;border-radius:4px;">−</button>
            <span id="qty-${i}">0</span>
            <button onclick="changeQty(${i}, 1)" style="width:24px;height:24px;border-radius:4px;">+</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="cart" id="cart-section"></div>
    <div id="qr-section" style="margin-top:1rem;text-align:center;"></div>
    <a class="map-link" href="${currentVenue.map}" target="_blank" style="margin-top:0.8rem;display:inline-block;">Открыть на карте</a>
  `;
  document.getElementById("modal").classList.add("open");
  updateCart();
  generateQR();
}

function changeQty(index, delta) {
  const item = currentVenue.menu[index];
  let existing = cart.find(c => c.name === item.name);
  if (delta > 0) {
    if (!existing) {
      cart.push({ ...item, qty: 1 });
    } else {
      existing.qty++;
    }
  } else if (existing) {
    existing.qty--;
    if (existing.qty <= 0) {
      cart = cart.filter(c => c.name !== item.name);
    }
  }
  const q = cart.find(c => c.name === item.name);
  document.getElementById(`qty-${index}`).textContent = q ? q.qty : 0;
  updateCart();
}

function generateQR() {
  const qrEl = document.getElementById("qr-section");
  if (!qrEl || typeof QRCode === 'undefined') return;
  const base = window.location.origin + window.location.pathname;
  const url = `${base}?venue=${currentVenue.id}&table=1`;
  qrEl.innerHTML = '<div id="qrcode"></div>';
  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 128,
    height: 128,
    colorDark: "#2C2A24",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M
  });
}

function callWaiter() {
  alert(`Официант вызван к столу ${currentTable}.`);
}

function updateCart() {
  const section = document.getElementById("cart-section");
  if (!section) return;
  if (cart.length === 0) {
    section.innerHTML = "<p style='color:var(--muted);font-size:0.9rem;'>Корзина пуста</p>";
    return;
  }
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  section.innerHTML = `
    <h3 style="margin-bottom:0.5rem;font-size:1rem;">Ваш заказ</h3>
    ${cart.map(i => `<div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;font-size:0.9rem;"><span>${i.name} × ${i.qty}</span><span>${i.price * i.qty} сом</span></div>`).join("")}
    <div style="font-weight:600;margin:0.5rem 0;">Итого: ${total} сом</div>
    <div class="order-form">
      <input type="text" id="clientName" placeholder="Ваше имя">
      <input type="text" id="clientPhone" placeholder="Телефон">
      <textarea id="clientComment" placeholder="Комментарий" rows="2"></textarea>
      <button class="btn" style="width:100%;" onclick="placeOrder()">Оформить ${currentVenue.cat === "barber" ? "запись" : "заказ"}</button>
    </div>
  `;
}

function placeOrder() {
  const name = document.getElementById("clientName").value.trim();
  const phone = document.getElementById("clientPhone").value.trim();
  if (!name || !phone) { alert("Укажите имя и телефон"); return; }
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const tableInfo = currentTable ? ` (стол ${currentTable})` : '';
  document.getElementById("modal-body").innerHTML = `
    <div style="text-align:center;padding:1.2rem 0;">
      <h3 style="color:var(--orange);">Заказ принят</h3>
      <p style="margin:0.5rem 0;">${currentVenue.name}${tableInfo}</p>
      <p>Сумма: ${total} сом</p>
      <p style="color:var(--muted);font-size:0.85rem;margin-top:0.5rem;">Заказ принят.</p>
      <button class="btn" style="margin-top:1rem;" onclick="closeModal()">Закрыть</button>
    </div>
  `;
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

function openAuth(type) {
  document.getElementById("authTitle").textContent = type === "login" ? "Вход" : "Регистрация";
  document.getElementById("authModal").classList.add("open");
}
function closeAuth() {
  document.getElementById("authModal").classList.remove("open");
}
function fakeAuth() {
  alert("Вход будет доступен после подключения базы данных");
  closeAuth();
}

function showPage(page) {
  document.getElementById("page-home").style.display = page === "home" ? "block" : "none";
  document.getElementById("page-guide").style.display = page === "guide" ? "block" : "none";
  document.getElementById("page-create").style.display = page === "create" ? "block" : "none";
  if (page === "create" && document.getElementById("menuBuilder").children.length === 0) {
    addMenuRow();
    addMenuRow();
  }
  window.scrollTo(0, 0);
}

function addMenuRow() {
  const div = document.createElement("div");
  div.className = "menu-builder-item";
  div.innerHTML = `
    <input type="text" placeholder="Название" class="mi-name">
    <input type="number" placeholder="Цена" class="mi-price" style="max-width:100px;">
  `;
  document.getElementById("menuBuilder").appendChild(div);
}

function saveVenue() {
  const name = document.getElementById("bizName").value.trim();
  const tgId = document.getElementById("telegramId").value.trim();
  if (!name) { alert("Укажите название"); return; }
    document.getElementById("telegramStatus").textContent = tgId ? "Подключено" : "";
  alert("Сохранено.");
  showPage("home");
}

document.querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderVenues(btn.dataset.cat);
  });
});

document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.getElementById("authModal").addEventListener("click", e => { if (e.target.id === "authModal") closeAuth(); });

renderVenues();
</script>
</body>
